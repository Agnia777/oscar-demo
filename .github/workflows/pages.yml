name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Публикуем только файлы сайтов (без CLAUDE.md, README и служебных файлов)
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html script.js robots.txt assets demo _site/
          touch _site/.nojekyll
          # Версия в адресах CSS/JS: после каждой публикации браузер берёт свежие файлы, а не кэш
          sed -i "s/__V__/${GITHUB_SHA::7}/g" _site/index.html _site/demo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
